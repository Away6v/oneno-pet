name: release

# 推送 v* 标签时触发：构建 Windows 安装包 → minisign 签名 → 生成 latest.json → 建 Release（草稿）
# 客户端固定读取 https://github.com/Away6v/oneno-pet/releases/latest/download/latest.json
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 同一个 tag 重复推送（或快速连推多个 tag）时串行化，避免两次构建并行上传、互相覆盖产物。
# 刻意不开 cancel-in-progress：中断一次正在上传产物的构建会留下半个 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 缓存 Rust 编译产物，避免每次全量编译
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      # 图标已随仓库提交（src-tauri/icons），无需再跑 npm run icons
      # 版本号三处必须一致（以 tauri.conf.json 为准），不一致直接失败
      - name: 校验版本号一致
        run: npm run sync-version -- --check

      # tag 名必须与 tauri.conf.json 的 version 一致。
      # 不校验的话，tag 打在了没改版本号的 commit 上时会「静默成功」——
      # 构建出来的包与 latest.json 里还是旧版本号，客户端永远认为「没有新版」，极难排查。
      - name: 校验 tag 与版本号一致
        shell: bash
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$VER" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 tauri.conf.json 的版本 v$VER 不一致；请先改版本号并提交，再重新打 tag"
            exit 1
          fi
          echo "tag 与版本号一致：v$VER"

      # 发版说明取自 CHANGELOG.md 的对应小节：客户端「发现新版本」界面显示的就是它，
      # 写死一句话会让用户永远看不到这一版改了什么。抽不到时脚本给兜底文案，不拦发版。
      # 多行值用 heredoc 写进 $GITHUB_OUTPUT，才能原样带换行传给 tauri-action。
      - name: 取发版说明
        id: notes
        shell: bash
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          {
            echo "body<<CHANGELOG_EOF"
            node scripts/changelog-section.mjs "$VER"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "已取到 [$VER] 的发版说明"

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 签名私钥：用于给安装包签名，客户端用编译进程序的公钥验签
          # 当前私钥未设密码，故不需要 TAURI_SIGNING_PRIVATE_KEY_PASSWORD；
          # 若日后换成带密码的私钥，需在此补上该环境变量并在仓库 Secrets 中配置
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "oneno-pet ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          # 先出草稿：确认构建无误后手动点发布，latest.json 才会被客户端读到
          # （releases/latest 只指向已发布且非预发布的 Release）
          releaseDraft: true
          # 带 `-` 的 tag（如 v0.2.0-beta.1）必须标成预发布：
          # releases/latest 只认「非草稿 + 非预发布」，写死 false 会让测试版直接变成
          # latest 推给所有用户 —— 这正是 set-version 允许 -beta 后缀时必须配套的一步。
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 项目只出 NSIS 包，明确让 updater 清单选它
          updaterJsonPreferNsis: true
